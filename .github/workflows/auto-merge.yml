name: Auto-Merge Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-merge'))

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR status
        id: check-pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : context.payload.check_suite.pull_requests[0].number;
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const approvedReviews = reviews.filter(r => r.state === 'APPROVED').length;

            const { data: statuses } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });

            const hasAutoMergeLabel = pr.labels.some(l => l.name === 'auto-merge');
            const allChecksPassed = statuses.state === 'success';
            const hasApproval = approvedReviews >= 1 || pr.reviewDecision === 'approved';
            const isMergeable = pr.mergeable;
            const isOpen = pr.state === 'open';

            core.setOutput('should_merge', isOpen && isMergeable && hasAutoMergeLabel && allChecksPassed && hasApproval);
            core.setOutput('pr_number', prNumber);
            core.setOutput('pr_title', pr.title);

      - name: Merge Pull Request
        if: steps.check-pr.outputs.should_merge == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt(steps.check-pr.outputs.pr_number);
            
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash',
              commit_title: steps.check-pr.outputs.pr_title
            });
